# What runs on the server: the app and its PostgreSQL database. Copy this file
# and a `.env` into ~/docker-compose/ on the droplet; the deploy workflow sets
# IMAGE_TAG, and everything else comes from that `.env`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Keeps the data across deploys and restarts.
    volumes:
      - booked-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: cornellappdev/booked-${BOOKED_ENV:-dev}:${IMAGE_TAG}
    env_file: .env
    # The database container is only reachable from the app, by name.
    environment:
      DB_HOST: db
      DB_PORT: '5432'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:4000:4000'
    # Run exactly one copy: each one runs its own hourly Cornell sync.
    restart: unless-stopped
    # Lets the server stop promptly when a deploy restarts it.
    init: true

volumes:
  booked-db-data:
